# Nav2 parameters for the Gazebo semantic demo.
#
# Derived from navi_nav2/nav2_bringup/params/nav2_params.yaml (dev), with the
# deltas the sim needs and nothing else, so a behaviour seen here transfers:
#
#   global_frame: odom      the sim has no map frame and no localizer; the
#                           3D ground-truth odom plays both roles.
#   static map_topic        /projected_map -- the traversability octomap grid,
#                           refreshed at 3 Hz, so map_subscribe_transient_local
#                           must stay false (the publisher is volatile).
#   obstacle sources        the sim publishes no /scan; the obstacle layer is
#                           left configured but will simply see nothing, which
#                           costmap tolerates with a warning.
#
# The point of running this at all: prove a global path threads the stair
# corridor the maps now leave open, and refuses it again when the keepout
# mask is armed.
bt_navigator:
  ros__parameters:
    use_sim_time: True
    #chang_fix
    # TF 체인: map -> odom_2d -> base_link.
    #   map->odom_2d : SLAM(laserMapping)이 발행. z=0, yaw-only 2D pose.
    #   odom_2d->base_link : SLAM 런치가 로봇 프로파일(navi_lidar) 오프셋으로 발행.
    # odom_topic 은 2D 내비게이션과 프레임이 일치하는 /odom_2d 를 쓴다
    # (full 3D 인 /aft_mapped_to_init 은 child frame 이 odom 이라 이 체인에 없다).
    global_frame: odom
    robot_base_frame: base_link
    odom_topic: /odom_2d
    #chang_fix
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.05
    min_y_velocity_threshold: 0.1
    min_theta_velocity_threshold: 0.02
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.12
      movement_time_allowance: 10.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 0.25
    # DWB parameters
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000

      # ---------- 샘플링 분포 튜닝 (Omni) ----------
      # vx는 주력, vy는 "필요할 때만" 조금 쓰는 느낌
      vx_std: 0.25         # 앞으로는 많이 샘플링
      vy_std: 0.15        # 옆걸음은 아주 약하게만 샘플링
      wz_std: 0.5

      # ---------- 속도 한계 ----------
      vx_max: 0.6         # 평소 전진 여유
      vx_min: -0.35       # 살짝 후진 허용 (싫으면 0.0으로)
      vy_max: 0.25        # 옆걸음은 0.25 m/s 정도만
      wz_max: 1.9

      iteration_count: 1
      prune_distance: 1.0
      #chang_fix
      # SLAM TF 체인(map->odom_2d->base_link) 지연 허용. map->odom_2d 는 LIO 가 스캔
      # 주기(10Hz)로 발행하므로 기본값(0.1)보다 여유를 둔다.
      transform_tolerance: 0.3
      #chang_fix

      temperature: 0.35
      gamma: 0.015

      # ★ Omni로 변경
      motion_model: "Omni"
      visualize: false

      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3

      AckermannConstraints:
        min_turning_r: 0.2   # Omni에서는 사실 크게 의미 없음

      critics: ["ConstraintCritic", "ObstaclesCritic", "GoalCritic", "GoalAngleCritic",
                "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.2   # 너무 멀리서부터 goal 집착 줄이기

      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.5
        threshold_to_consider: 0.5

      # 앞으로 가는 궤적 우대 (옆걸음 우회를 과하게 막지 않도록 8.0 -> 5.0)
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.4

      ObstaclesCritic:
        enabled: true
        cost_power: 1
        # ★ 정적 회피 폭은 유지(넓게 안 피하게): repulsion/inflation은 그대로 둠
        repulsion_weight: 3.0
        # ★ 동적 장애물 worst-case 대비: 충돌 직전 방어만 강화 (20.0 -> 24.0)
        critical_weight: 18.0
        consider_footprint: true
        collision_cost: 10000.0
        # ★ 순항 회피 폭은 그대로 두되, 막판 안전 마진만 소폭 확보 (0.12 -> 0.16)
        #   repulsion이 아니라 near-collision 밴드만 넓혀 정적 "멀리 피함" 재발 방지
        collision_margin_distance: 0.08
        near_goal_distance: 0.5

      # 갱신된 global path를 따라가되, 과한 집착은 완화 (10.0 -> 6.0)
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 6.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 0.40
        offset_from_furthest: 20
        use_path_orientations: false

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        offset_from_furthest: 5
        threshold_to_consider: 1.0

      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 4
        threshold_to_consider: 0.4
        max_angle_to_furthest: 1.0
        forward_preference: true



local_costmap:
  local_costmap:
    ros__parameters:
      # ★ 동적 장애물이 costmap에 더 빨리 반영되도록 반응속도↑ (10.0 -> 15.0)
      update_frequency: 15.0
      publish_frequency: 5.0
      # REP-105: rolling local costmap in odom; pose via odom->base_link TF
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: True
      transform_tolerance: 0.5
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.04
      # MPPI ObstaclesCritic(consider_footprint: true) 및 global_costmap과 동일 footprint 필요
      footprint: "[[-0.30, -0.25], [-0.30, 0.25], [0.30, 0.25], [0.30, -0.25]]"
      footprint_padding: 0.03
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # ★ 회피 폭 축소: scaling 가파르게(3->5), inflation 거리 축소(0.55->0.40)
        cost_scaling_factor: 3.0
        inflation_radius: 0.30
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 5.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
      always_send_full_costmap: True




global_costmap:
  global_costmap:
    ros__parameters:
      # ★ global path가 새 장애물을 빠르게 반영해 유동적으로 재계획되도록 1.0 -> 5.0
      update_frequency: 1.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: True
      footprint: "[[-0.30, -0.25], [-0.30, 0.25], [0.30, 0.25], [0.30, -0.25]]"
      footprint_padding: 0.03
      resolution: 0.03
      track_unknown_space: true
      # ★ 동적 장애물을 global path에 반영하기 위해 obstacle_layer 추가
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: False
        map_topic: /projected_map
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        # ★ static 맵의 사라진 장애물(phantom obstacle)을 실시간 반영: Maximum(1) -> Overwrite(0)
        #   track_unknown_space: true 라 미관측 셀은 NO_INFORMATION이므로 벽은 보존되고,
        #   라이다가 비었다고 관측한 셀만 static 254를 덮어써 경로가 재계획됨
        combination_method: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 5.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # ★ 회피 폭을 적당히: scaling을 가파르게(4->5) 해 경로가 장애물에 더 붙어 우회
        cost_scaling_factor: 3.0
        inflation_radius: 0.30
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: True
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: False

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.55
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 5.0
    #behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    #behavior_plugins: ["spin", "backup", "assisted_teleop", "wait"]
    behavior_plugins: ["backup", "assisted_teleop", "wait"]
    # spin:
    #  plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    # drive_on_heading:
    #   plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    #chang_fix
    transform_tolerance: 0.3
    #chang_fix
    use_sim_time: True
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.6, 0.25, 1.9]
    min_velocity: [-0.1, -0.25, -1.9] # x y  yaw
    max_accel: [1.5, 1.0, 3.0]
    max_decel: [-1.5, -1.0, -3.0]
    #chang_fix
    # bt_navigator 와 같은 토픽을 쓴다. 예전엔 /aft_mapped_to_init(full 3D)이었는데,
    # 그 child frame 은 odom 이라 Nav2 의 map->odom_2d->base_link 체인과 무관하다.
    # (지금은 feedback: OPEN_LOOP 이라 구독 자체를 안 하지만, CLOSED_LOOP 으로 바꾸면
    #  즉시 문제가 되므로 미리 맞춰 둔다.)
    odom_topic: "/odom_2d"
    #chang_fix
    odom_duration: 0.1
    deadband_velocity: [0.01, 0.06, 0.05]
    velocity_timeout: 1.0

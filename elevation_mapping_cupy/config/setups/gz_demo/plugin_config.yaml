# Navigation terrain-analysis chain for the Fortress demo.
#
# The default core/plugin_config.yaml is a digging chain (spike removal,
# inpainting). Driving needs the opposite priorities: measure slope, steps,
# and roughness explicitly, keep unobserved cells unknown, and grade the
# result instead of patching the surface. Selected per robot through the
# plugin_config_file parameter, so the digging chain stays untouched.
#
# Ground truth in the demo world for checking the numbers: a 12 degree ramp,
# 0.15 m stair risers, a 0.12 m curb, flat ground everywhere else.
slope_filter:
  enable: True
  fill_nan: False
  is_height_layer: False
  layer_name: "slope"                       # degrees
  extra_params:
    window_size: 3
    min_valid_ratio: 0.5
step_filter:
  enable: True
  fill_nan: False
  is_height_layer: False
  layer_name: "step"                        # meters, max-min in the window
  extra_params:
    window_size: 5                          # 0.25 m reach at 0.05 m cells
    min_valid_count: 4
roughness_filter:
  enable: True
  fill_nan: False
  is_height_layer: False
  layer_name: "roughness"                   # meters, RMS off the local plane
  extra_params:
    window_size: 5
    min_valid_count: 6
drivability_filter:
  enable: True
  fill_nan: False
  is_height_layer: False
  layer_name: "drivability"                 # 1 flat .. 0 at any limit
  extra_params:
    layers: ["slope", "step", "roughness"]
    # Quadruped-scale envelope, matching what haechi will get. The 0.15 m
    # stair risers land at 0.25 here: climbable, but barely.
    # This is the WALKING envelope, not the platform's limit. The D1 MaxPro
    # is rated for 45 degrees and 30 cm stairs, but 30 cm reaches those only
    # in the stair gait, and a step limit that generous also waves the robot
    # over a 12 cm curb into the roadway. So the limit describes the default
    # gait and the stairs layer marks where changing gait unlocks more --
    # which is also how a riser gets across: its slope is vertical, so it
    # scores zero here whatever the step limit says, and passes because it
    # is flagged as a flight rather than because it was called flat.
    limits: [45.0, 0.15, 0.06]
semantic_safety_filter:
  enable: True
  fill_nan: False
  is_height_layer: False
  layer_name: "safety"                      # 1 safe .. 0 forbidden
  extra_params:
    base_layer: "drivability"
    # One hazard channel now, and it is a judgement rather than a class:
    # SAM-TP's traversability logit. A setup with no camera never publishes
    # it, and there safety simply equals drivability.
    hazard_layers: ["untrav"]
    # Deliberately timid. untrav is SAM-TP's raw logit, where 0 is the model's
    # own boundary; a cell has to reach +1 before it costs anything at all and
    # +3 before it is forbidden outright. Weak opinions leave the lidar's
    # verdict alone, which is what kept the earlier classifier from painting
    # good ground as obstacle.
    hazard_low: 1.0
    hazard_high: 3.0
    # And only nearby. Beyond this the camera's ray grazes the ground so
    # flatly that one pixel paints a long streak of cells, which is where
    # the speckle around the robot came from.
    hazard_range: 4.0
stairs_filter:
  enable: True
  fill_nan: False
  is_height_layer: False
  layer_name: "stairs"          # +confirmed climb .. -confirmed descent, 0 not stairs
  extra_params:
    # A flight is riser AND tread, alternating. Crediting only risers made the
    # layer stripy and let any 18-47 degree bank through as climbable; a plane
    # has a tread fraction of exactly zero, which is where the separation
    # comes from. The ratios are deliberately low: both fractions oscillate
    # as the window slides over the tread period, and thresholds near their
    # mean fragment a flight into one blob per riser.
    min_riser: 0.09
    max_riser: 0.30             # D1 MaxPro climbs 30 cm continuous stairs
    riser_window: 3             # stair structure, not foot reach
    max_tread_step: 0.04
    max_tread_slope: 15.0
    max_tread_roughness: 0.03
    struct_window: 21           # 1.05 m: two to three risers at 0.4 m treads
    min_riser_ratio: 0.10
    min_tread_ratio: 0.08
    min_total_gain: 0.25
    min_valid_ratio: 0.5
    min_valid_ratio_confirmed: 0.65
    wall_window: 3              # a cell touching a wall-sized face is never stairs
    interior_erosion: 5         # a wall through the middle disqualifies; along the edge does not
    max_range: 4.5              # past this a grazing ray's noise looks like a riser
    min_risers: 2
    min_risers_confirmed: 3     # repetition: what a terrace and a lone ledge lack
    max_rise_std: 0.04
    min_tread_depth: 0.20
    max_tread_depth: 0.60
    min_component_cells: 60
ramp_filter:
  enable: True
  fill_nan: False
  is_height_layer: False
  layer_name: "ramp"            # +confirmed climb .. -confirmed descent
  extra_params:
    # A ramp is continuous where a flight is broken: tilted everywhere,
    # smooth, and with no riser-sized break in it. That last clause is what
    # keeps a staircase out of this layer, and the stairs filter's tread
    # requirement is what keeps a ramp out of that one.
    min_slope: 8.0              # below this it is ground with a lean on it
    max_slope: 45.0             # the platform's rated gradient
    max_roughness: 0.05
    max_riser_step: 0.12        # over the fine window, so a 40 deg plane still qualifies
    struct_window: 21
    min_ramp_ratio: 0.50
    min_total_gain: 0.20
    max_slope_std: 8.0          # a ramp is planar; rubble is not
    max_range: 4.5
    min_component_cells: 60

# Navigation terrain-analysis chain for the Fortress demo.
#
# The default core/plugin_config.yaml is a digging chain (spike removal,
# inpainting). Driving needs the opposite priorities: measure slope, steps,
# and roughness explicitly, keep unobserved cells unknown, and grade the
# result instead of patching the surface. Selected per robot through the
# plugin_config_file parameter, so the digging chain stays untouched.
#
# Ground truth in the demo world for checking the numbers: a 12 degree ramp,
# 0.15 m stair risers, a 0.12 m curb, flat ground everywhere else.
slope_filter:
  enable: True
  fill_nan: False
  is_height_layer: False
  layer_name: "slope"                       # degrees
  extra_params:
    window_size: 3
    min_valid_ratio: 0.5
step_filter:
  enable: True
  fill_nan: False
  is_height_layer: False
  layer_name: "step"                        # meters, max-min in the window
  extra_params:
    window_size: 5                          # 0.25 m reach at 0.05 m cells
    min_valid_count: 4
roughness_filter:
  enable: True
  fill_nan: False
  is_height_layer: False
  layer_name: "roughness"                   # meters, RMS off the local plane
  extra_params:
    window_size: 5
    min_valid_count: 6
drivability_filter:
  enable: True
  fill_nan: False
  is_height_layer: False
  layer_name: "drivability"                 # 1 flat .. 0 at any limit
  extra_params:
    layers: ["slope", "step", "roughness"]
    # Quadruped-scale envelope, matching what haechi will get. The 0.15 m
    # stair risers land at 0.25 here: climbable, but barely.
    limits: [25.0, 0.20, 0.05]
semantic_safety_filter:
  enable: True
  fill_nan: False
  is_height_layer: False
  layer_name: "safety"                      # 1 safe .. 0 forbidden
  extra_params:
    base_layer: "drivability"
    # Classes that make a cell unsafe whatever the geometry says. The shipped
    # model knows these; the ones this is really for are roadway and vehicle
    # lanes, and they arrive with the model swap. Setups without a camera have
    # none of these layers, and there safety just equals drivability.
    # untrav is SAM-TP's continuous surface judgement -- high means hard or
    # impossible ground, whatever its class. person and car stay as the
    # discrete hazards the classifier gets right. road is out: on synthetic
    # textures the Cityscapes head called the robot's own footing road and
    # inverted the whole verdict, measured at 38% of the map unsafe against
    # 2.6% by geometry.
    hazard_layers: ["untrav", "person", "car"]
    hazard_low: 0.25
    hazard_high: 0.60

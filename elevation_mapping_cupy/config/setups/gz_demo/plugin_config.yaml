# Navigation terrain-analysis chain for the Fortress demo.
#
# The default core/plugin_config.yaml is a digging chain (spike removal,
# inpainting). Driving needs the opposite priorities: measure slope, steps,
# and roughness explicitly, keep unobserved cells unknown, and grade the
# result instead of patching the surface. Selected per robot through the
# plugin_config_file parameter, so the digging chain stays untouched.
#
# Ground truth in the demo world for checking the numbers: a 12 degree ramp,
# 0.15 m stair risers, a 0.12 m curb, flat ground everywhere else.
slope_filter:
  enable: True
  fill_nan: False
  is_height_layer: False
  layer_name: "slope"                       # degrees
  extra_params:
    window_size: 3
    min_valid_ratio: 0.5
step_filter:
  enable: True
  fill_nan: False
  is_height_layer: False
  layer_name: "step"                        # meters, max-min in the window
  extra_params:
    window_size: 5                          # 0.25 m reach at 0.05 m cells
    min_valid_count: 4
roughness_filter:
  enable: True
  fill_nan: False
  is_height_layer: False
  layer_name: "roughness"                   # meters, RMS off the local plane
  extra_params:
    window_size: 5
    min_valid_count: 6
drivability_filter:
  enable: True
  fill_nan: False
  is_height_layer: False
  layer_name: "drivability"                 # 1 flat .. 0 at any limit
  extra_params:
    layers: ["slope", "step", "roughness"]
    # Quadruped-scale envelope, matching what haechi will get. The 0.15 m
    # stair risers land at 0.25 here: climbable, but barely.
    # The platform's own envelope, not a small dog's: the D1 MaxPro is rated
    # for a 45 degree gradient and 30 cm continuous stairs. Against a 0.20 m
    # step limit a 0.15 m stair riser scored 0.25 and the whole flight came
    # out as obstacle stripes, which no amount of flagging afterwards can
    # honestly repair -- the limit was simply describing a different robot.
    # At 0.30 m the same riser scores 0.50 and the flight reads as ground.
    limits: [45.0, 0.30, 0.06]
semantic_safety_filter:
  enable: True
  fill_nan: False
  is_height_layer: False
  layer_name: "safety"                      # 1 safe .. 0 forbidden
  extra_params:
    base_layer: "drivability"
    # One hazard channel now, and it is a judgement rather than a class:
    # SAM-TP's traversability logit. A setup with no camera never publishes
    # it, and there safety simply equals drivability.
    hazard_layers: ["untrav"]
    # Deliberately timid. untrav is SAM-TP's raw logit, where 0 is the model's
    # own boundary; a cell has to reach +1 before it costs anything at all and
    # +3 before it is forbidden outright. Weak opinions leave the lidar's
    # verdict alone, which is what kept the earlier classifier from painting
    # good ground as obstacle.
    hazard_low: 1.0
    hazard_high: 3.0
stairs_filter:
  enable: True
  fill_nan: False
  is_height_layer: False
  layer_name: "stairs"                      # 1 = climbable stair flight
  extra_params:
    min_riser: 0.09                         # below: rough ground / a curb
    max_riser: 0.30                         # D1 MaxPro climbs 30 cm continuous stairs
    gain_window: 21                         # 1.05 m sustained-climb window
    min_total_gain: 0.25                    # one 0.12 m curb fails, stairs pass
    min_valid_ratio: 0.4

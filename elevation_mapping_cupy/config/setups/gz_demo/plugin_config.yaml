# Navigation terrain-analysis chain for the Fortress demo.
#
# The default core/plugin_config.yaml is a digging chain (spike removal,
# inpainting). Driving needs the opposite priorities: measure slope, steps,
# and roughness explicitly, keep unobserved cells unknown, and grade the
# result instead of patching the surface. Selected per robot through the
# plugin_config_file parameter, so the digging chain stays untouched.
#
# Ground truth in the demo world for checking the numbers: a 12 degree ramp,
# 0.15 m stair risers, a 0.12 m curb, flat ground everywhere else.
slope_filter:
  enable: True
  fill_nan: False
  is_height_layer: False
  layer_name: "slope"                       # degrees
  extra_params:
    window_size: 3
    min_valid_ratio: 0.5
step_filter:
  enable: True
  fill_nan: False
  is_height_layer: False
  layer_name: "step"                        # meters, max-min in the window
  extra_params:
    window_size: 5                          # 0.25 m reach at 0.05 m cells
    min_valid_count: 4
roughness_filter:
  enable: True
  fill_nan: False
  is_height_layer: False
  layer_name: "roughness"                   # meters, RMS off the local plane
  extra_params:
    window_size: 5
    min_valid_count: 6
drivability_filter:
  enable: True
  fill_nan: False
  is_height_layer: False
  layer_name: "drivability"                 # 1 flat .. 0 at any limit
  extra_params:
    layers: ["slope", "step", "roughness"]
    # Quadruped-scale envelope, matching what haechi will get. The 0.15 m
    # stair risers land at 0.25 here: climbable, but barely.
    limits: [25.0, 0.15, 0.05]   # step 0.15: the 0.12 m curb scores 0.21, a SOLID line (0.20 left it at 0.405, dashed against the 0.45 cut)
semantic_safety_filter:
  enable: True
  fill_nan: False
  is_height_layer: False
  layer_name: "safety"                      # 1 safe .. 0 forbidden
  extra_params:
    base_layer: "drivability"
    # Classes that make a cell unsafe whatever the geometry says. The shipped
    # model knows these; the ones this is really for are roadway and vehicle
    # lanes, and they arrive with the model swap. Setups without a camera have
    # none of these layers, and there safety just equals drivability.
    # untrav is SAM-TP's continuous surface score (high = hard ground);
    # person and car are the discrete hazards the classifier is reliable on.
    # road is NOT here, and the reason is measured: on the synthetic street
    # the classifier flips between runs -- one drive read road 0.99 on the
    # roadway and 0.06 on the sidewalk, the next read 0.22 on the sidewalk
    # and 0.00 on the roadway, poisoning the robot's own footing. A policy
    # signal that unstable belongs behind a real-footage evaluation, not in
    # the safety product.
    hazard_layers: ["untrav"]
    # untrav is a NEGATED RAW LOGIT now (the sigmoid crushed SAM-TP's
    # contrast out of the map): 0 is the model's own decision boundary,
    # positive is increasingly bad. Penalty starts right at the boundary and
    # saturates three logits past it.
    # Ramp spans the model's uncertain band: the roadway hovers at +0.2..0.4
    # logits, and with the old 0..3 ramp that scored safety 0.79 -- ABOVE the
    # costmap's free cut, so the camera was actively clearing the roadway the
    # robot must never enter. -0.5..1.0 puts weak positives (roadway) in the
    # caution band and leaves clear negatives (sidewalk, -1.3) untouched.
    # Direct SAM-TP verdict: logit above 0.5 -> forbidden, below -> the
    # lidar's call. No ramp, no blending; the roadway is kept out by the
    # curb's geometry line, the camera only vetoes what it is sure about.
    veto_logit: 0.5
    veto_range: 3.0    # camera judges only the ground it is about to drive over
    hazard_low: -0.5
    hazard_high: 0.75
    # Conservative mode: ground the camera never saw caps at 0.55,
    # between the costmap's obstacle cut (0.4) and free cut (0.7) --
    # unseen stays unknown instead of free-on-geometry-alone.
    unobserved_cap: 1.0    # off: unseen ground is the lidar's call, not a penalty
stairs_filter:
  enable: True
  fill_nan: False
  is_height_layer: False
  layer_name: "stairs"                      # 1 = climbable stair flight
  extra_params:
    min_riser: 0.09                         # below: rough ground / ramp
    max_riser: 0.22                         # above: a wall, no gait helps
    gain_window: 21                         # 1.05 m sustained-climb window
    min_total_gain: 0.25                    # a 0.12 m curb fails, stairs pass
    min_valid_ratio: 0.4

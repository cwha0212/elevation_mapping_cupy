# =============================================================================
# Gazebo Fortress demo -- differential-drive robot with a 360 degree lidar
# and a forward colour camera, driving past a ramp, stairs, and a curb.
#
# The split matters: geometry arrives from all around, semantics only from
# the front cone, and the map is what carries the labels round to the sides
# and behind as the robot moves. That is haechi's situation exactly.
#
# Launch with elevation_mapping_cupy/launch/gz_fortress_demo.launch.py, which
# starts the simulator, bridges the topics, and runs this node.
#
# Resolution matches the haechi setup on purpose: 0.05 m is what it takes to
# keep a 0.12 m curb from smearing into the ground, and running the demo at the
# same setting makes its GPU cost representative.
# =============================================================================
/elevation_mapping_node:
  ros__parameters:
    map_frame: 'odom'
    base_frame: 'base_link'
    corrected_map_frame: 'odom'

    resolution: 0.05
    map_length: 10.0

    # The simulator's odometry is exact, so there is no drift to compensate.
    enable_drift_compensation: false

    initialize_method: 'linear'
    initialize_frame_id: ['base_link']
    initialize_tf_offset: [0.0]
    use_initializer_at_start: true

    # 'color' packs rgb into one float per cell; 'exponential' is the only other
    # image fusion registered (see Parameter.fusion_algorithms).
    image_channel_fusions:
      rgb: 'color'
      default: 'exponential'

    subscribers:
      lidar:
        # 360 degree geometry, the way haechi's three merged lidars supply it.
        # The map fills in all around the robot, not only inside a camera cone.
        topic_name: '/lidar/points'
        data_type: pointcloud

      # Separate colour camera, mounted apart from the depth sensor the way
      # haechi's camera sits ahead of the lidar origin. Its rgb lands on the
      # elevation surface, so where a known-coloured marker ends up on the map
      # tells us whether the projection's R/t convention is right.
      color_cam:
        topic_name: '/color_cam/image'
        camera_info_topic_name: '/color_cam/camera_info'
        channels: ['rgb']
        data_type: image

    publishers:
      elevation_map_raw:
        layers: ['elevation', 'traversability', 'variance', 'rgb']
        basic_layers: ['elevation']
        fps: 5.0
      # Terrain analysis from the navigation plugin chain (plugin_config.yaml
      # next to this file; smooth/erosion belong to the digging chain and do
      # not exist here).
      elevation_map_terrain:
        layers: ['elevation', 'slope', 'step', 'roughness', 'drivability']
        basic_layers: ['elevation']
        fps: 3.0

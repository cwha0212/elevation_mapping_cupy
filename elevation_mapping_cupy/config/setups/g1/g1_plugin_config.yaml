# Settings of the plugins. (The plugins should be stored in script/plugins)
min_filter:
  enable: True
  fill_nan: False
  is_height_layer: True
  layer_name: "min_filter"
  extra_params:
    dilation_size: 1
    iteration_n: 30

# Disabled: nothing consumes these layers. The controller samples 'inpaint' and
# g1_height_scan_node samples 'min_smooth_filter'. Every enabled plugin costs GPU
# work on each map_acquire cycle, and this node is compute-bound on the Jetson
# (it publishes ~3.4 Hz against the 5 Hz it is configured for), which starves the
# livox driver / DLIO that feed base_lin_vel. Re-enable if you need them in RViz.
max_filter:
  enable: False
  fill_nan: False
  is_height_layer: True
  layer_name: "max_filter"
  extra_params:
    dilation_size: 5
    iteration_n: 10

smooth_filter:
  enable: False
  fill_nan: False
  is_height_layer: True
  layer_name: "smooth"
  extra_params:
    input_layer_name: "min_filter"

# The layer the controller samples for its height observation, so it MUST come
# out hole-free.
#
# max_hole_area and fill_border_holes are ROS 2-only additions; the ROS 1
# plugin inpainted unconditionally. Their defaults (64 cells = 0.10 m^2 at
# 0.04 m, and skip anything touching the map border) make this plugin a NO-OP
# for the only hole that matters: the MID-360 sits ~1.3 m up looking down at
# -52 deg at best, so it cannot see the ground within a ~1.3 m radius of the
# robot -- a ~5.2 m^2 / ~3270-cell blind disc, 50x over the default cap, that
# also merges with the unobserved region at the map border. Measured with the
# defaults: 'inpaint' was finite in only 39% of the central 3x3 m, identical to
# raw 'elevation', while the controller samples x +/-0.8, y +/-0.5 -- entirely
# inside that disc. Every NaN then became HeightMapHandler's crude
# base_z - 0.76 substitute instead of a real interpolated height.
#
# The rule below is "fill what real data encloses, never extrapolate off the
# edge of knowledge":
#   max_hole_area: 0      -> no area cap, so the blind disc (~3300 cells) and
#                            obstacle shadows are filled however big they are.
#   fill_border_holes: F  -> the unobserved region beyond sensor range touches
#                            the map border and is left NaN.
# Setting fill_border_holes: true instead makes cv.inpaint extrapolate across
# the whole unknown map, and Telea with inpaint_radius 1 over thousands of cells
# propagates in a thin front from whatever is nearest -- including the 1.5 m
# staircase -- which shows up as high spikes and ridges in the far field.
inpainting:
  enable: True
  fill_nan: False
  is_height_layer: True
  layer_name: "inpaint"
  extra_params:
    method: "telea"
    max_hole_area: 0
    fill_border_holes: false

min_smooth_filter:
  enable: True
  fill_nan: False
  is_height_layer: True
  layer_name: "min_smooth_filter"
  extra_params:
    input_layer_name: "min_filter"
    size: 2

# Settings of the plugins. (The plugins should be stored in script/plugins)
min_filter:
  enable: True
  fill_nan: False
  is_height_layer: True
  layer_name: "min_filter"
  extra_params:
    dilation_size: 1
    iteration_n: 30

# Disabled: nothing consumes these layers, and every enabled plugin costs GPU
# work per map_acquire cycle on a node that is already compute-bound here.
# Re-enable if you need them in RViz.
max_filter:
  enable: False
  fill_nan: False
  is_height_layer: True
  layer_name: "max_filter"
  extra_params:
    dilation_size: 5
    iteration_n: 10

smooth_filter:
  enable: False
  fill_nan: False
  is_height_layer: True
  layer_name: "smooth"
  extra_params:
    input_layer_name: "min_filter"

inpainting:
  enable: True
  fill_nan: False
  is_height_layer: True
  layer_name: "inpaint"
  extra_params:
    method: "telea"

min_smooth_filter:
  enable: True
  fill_nan: False
  is_height_layer: True
  layer_name: "min_smooth_filter"
  extra_params:
    input_layer_name: "min_filter"
    size: 2

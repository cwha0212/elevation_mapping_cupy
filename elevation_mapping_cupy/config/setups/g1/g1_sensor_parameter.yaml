/elevation_mapping_node:
  ros__parameters:
    pointcloud_channel_fusions:
      rgb: "color"
      default: "average"

    image_channel_fusions:
      rgb: "color"
      default: "exponential"
      feat_.*: "exponential"
      sem_.*: "exponential"

    # Only the layers something actually consumes are published. Each layer is a
    # full 133x133 float grid that has to be fetched from the GPU and serialised
    # every publish; this node is compute-bound on the Jetson, and the spare work
    # starves the livox driver / DLIO that feed base_lin_vel.
    #   inpaint           -> g1_ctrl height observation (deploy.yaml height_map)
    #   min_smooth_filter -> g1_base_odom g1_height_scan_node (height_layer param)
    # elevation_map_recordable is dropped: nothing subscribes to it (record with
    # ros2 bag instead). Add layers back if you need them in RViz.
    publishers:
      elevation_map_raw:
        layers: ["elevation"]
        basic_layers: ["elevation"]
        fps: 5.0

      filtered_elevation_map:
        layers: ["inpaint", "min_smooth_filter"]
        basic_layers: ["inpaint"]
        fps: 5.0

    subscribers:
      Livox:
        topic_name: "/robot/dlio/odom_node/pointcloud/deskewed"
        data_type: "pointcloud"
        ray_source_frame: "mid360_link"

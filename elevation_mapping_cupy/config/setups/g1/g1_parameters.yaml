/elevation_mapping_node:
  ros__parameters:
    #### Basic parameters ########
    # Values below match the reference stack in working/ that maps reliably on
    # this robot. 0.04 m over an 8 m map is 200x200 = 40k cells, ~2.25x more
    # than 0.06, so the sparse MID360 scan leaves cells that never receive a
    # point -> holes that never fill. The policies sample the map on a 0.1 m
    # grid, so 0.06 is still finer than the observation spacing.
    resolution: 0.04
    map_length: 8.0
    sensor_noise_factor: 0.05
    # Stricter than 2.0 rejects valid returns as outliers, so cells stop being
    # updated and stale/empty patches persist.
    mahalanobis_thresh: 3.0
    outlier_variance: 0.015
    drift_compensation_variance_inlier: 0.05
    max_drift: 0.1
    drift_compensation_alpha: 0.1
    time_variance: 0.0001
    max_variance: 100.0
    initial_variance: 1000.0
    traversability_inlier: 0.9
    dilation_size: 3
    wall_num_thresh: 20
    min_height_drift_cnt: 100
    position_noise_thresh: 0.01
    orientation_noise_thresh: 0.01
    position_lowpass_alpha: 0.2
    orientation_lowpass_alpha: 0.2
    min_valid_distance: 0.4
    max_height_range: -0.1
    ramped_height_range_a: 0.3
    ramped_height_range_b: 1.0
    ramped_height_range_c: 0.2
    update_variance_fps: 10.0
    update_pose_fps: 20.0
    time_interval: 0.1
    map_acquire_fps: 10.0
    publish_statistics_fps: 1.0

    max_ray_length: 10.0
    cleanup_step: 0.005
    cleanup_cos_thresh: 0.7

    safe_thresh: 0.7
    safe_min_thresh: 0.4
    max_unsafe_n: 10

    overlap_clear_range_xy: 4.0
    overlap_clear_range_z: 2.0

    # map_frame stays namespaced: DLIO now runs under the "robot" namespace, so
    # its odometry frame is robot/odom (the reference stack ran DLIO un-namespaced
    # and called it plain "odom" — same physical frame).
    map_frame: "robot/odom"
    # torso_link, as in the reference stack: this centres the map on the same
    # body the controller samples the height scan around. robot/base_link is
    # DLIO's lidar baselink, which centres the map on the sensor instead.
    base_frame: "torso_link"
    corrected_map_frame: "odom_corrected"

    #### Feature toggles ########
    enable_edge_sharpen: true
    enable_visibility_cleanup: true
    enable_drift_compensation: true
    enable_overlap_clearance: true
    enable_pointcloud_publishing: false
    enable_drift_corrected_TF_publishing: false
    enable_normal_color: false

    #### Traversability filter ########
    use_chainer: false

    #### Upper bound ########
    use_only_above_for_upper_bound: false

    #### Initializer ########
    # ENABLED, as in the ROS 1 stack: seed the map with a plane through the two
    # ankle frames, 0.04 m below them (initialize_tf_offset), so the footprint
    # starts at real foot level instead of empty. The lidar cannot see the
    # ground within ~1.3 m of the robot (see the inpainting note in
    # g1_plugin_config.yaml), so without this the area the controller samples
    # has no measured data at all until the robot has walked somewhere.
    #
    # START WITH THE FEET ON THE GROUND. _initialize_with_tf() runs exactly ONCE
    # and then clears use_initializer_at_start, so whatever height the feet are
    # at in that instant is frozen in. Measured on hardware after starting with
    # the robot raised on its stand: a dead-flat disc out to 0.8 m sitting 74 mm
    # ABOVE the true floor, while the map beyond 0.8 m was correct to 5 mm --
    # and the height scan (x +/-0.8, y +/-0.5) lies entirely inside that disc,
    # so every sample read 74 mm high. On a stand, or after any start-up pose
    # you do not trust, restart the mapping node once the robot is standing.
    initialize_method: "linear"
    initialize_frame_id: ["left_ankle_roll_link", "right_ankle_roll_link"]
    initialize_tf_offset: [-0.04, -0.04]
    dilation_size_initialize: 5
    initialize_tf_grid_size: 0.1
    use_initializer_at_start: true
    always_clear_with_initializer: false

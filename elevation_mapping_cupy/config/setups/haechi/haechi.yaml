# =============================================================================
# haechi -- quadruped, 3 LiDARs (RSAIRY front + 2x Livox MID360) merged by
# navi_lidar_node, plus one front RGB camera for semantics.
#
# Launch with elevation_mapping_cupy/launch/haechi.launch.py, which also brings
# up the semantic image node and the camera static transform.
# =============================================================================
/elevation_mapping_node:
  ros__parameters:
    #### Frames ########
    # Measured on the real bag (2026-09-28, tf2 during replay): navi's LIO
    # publishes map->odom as the BODY pose -- odom moves with the robot and
    # odom->lidar_frame is a static identity. With map_frame set to odom the
    # map centre sat at (0,0) forever, never translated, and turned with the
    # body: every cell mixed measurements of different ground as the robot
    # moved, which is where the inflated step and roughness on flat grass
    # came from. The fixed world frame is `map`; it is also what navi's Nav2
    # costmaps use as global_frame, so the local grid lands there directly.
    # `base_link` hangs off `odom_2d` (z=0, yaw only) and would tilt the map
    # whenever the robot leans; `lidar_frame` (merged-cloud frame, origin =
    # left MID360 IMU, axes = robot FLU) sits on the 3D chain.
    map_frame: 'map'
    base_frame: 'lidar_frame'
    corrected_map_frame: 'map'

    #### Map geometry ########
    # 0.05 m resolves the 10-20 cm curbs that separate roadway from sidewalk;
    # the 0.1 m default smears them. 10 m square keeps the cell count (and the
    # GPU cost) down next to FAST-LIO and the segmentation network.
    resolution: 0.05
    map_length: 10.0

    #### Drift ########
    # FAST-LIO already corrects the body pose. Running the built-in compensation
    # on top of it means two estimators fighting over the same z.
    enable_drift_compensation: false

    #### Fusion ########
    # Image channels only; the lidar path takes xyz and nothing else.
      default: 'class_average'
    image_channel_fusions:
      rgb: 'color'
      default: 'exponential'

    #### Subscribers ########
    subscribers:
      # Geometry, 360 degrees. The deskewed topic is the rotation-corrected
      # merge of all three LiDARs; header frame is `lidar_frame`.
      merged_lidar:
        topic_name: '/points/merged_deskewed'
        data_type: pointcloud

      # Semantics, front cone only. The labels are painted onto the map cells
      # and persist as the robot walks, so coverage accumulates over time.
      # SAM-TP, published by scripts/samtp_node.py in the front_cam
      # namespace. One float channel: `untrav`, the negated raw
      # traversability logit (high = hard ground). Not a sigmoid -- the
      # contrast the model produces would be squeezed out of the map.
      front_cam:
        topic_name: '/front_cam/samtp_score'
        camera_info_topic_name: '/front_cam/samtp_camera_info'
        channel_info_topic_name: '/front_cam/samtp_channel_info'
        channels: ['untrav']
        data_type: image

    #### Publishers ########
    publishers:
      elevation_map_raw:
        layers: ['elevation', 'traversability', 'variance']
        basic_layers: ['elevation']
        fps: 5.0
      # Navigation terrain layers from setups/haechi/plugin_config.yaml (the
      # launch selects it over the digging chain via plugin_config_file).
      elevation_map_terrain:
        # The navigation chain's layers. stairs / ramp / drop belong to the
        # gait chain (plugin_config_gait.yaml) and are added by haechi.launch.py
        # gait:=true; listing a layer no plugin produces would abort a publish.
        layers: ['elevation', 'slope', 'step', 'roughness', 'drivability', 'safety']
        basic_layers: ['elevation']
        fps: 3.0
      elevation_map_semantic:
        # basic_layers cannot be empty here: an empty sequence arrives as an
        # untyped parameter and the node refuses it at startup, taking the
        # whole chain down with it.
        layers: ['elevation', 'untrav']
        basic_layers: ['elevation']
        fps: 3.0

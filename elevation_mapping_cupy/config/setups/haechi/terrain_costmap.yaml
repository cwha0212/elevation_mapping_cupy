# =============================================================================
# A Nav2 costmap fed the terrain judgement as a GRID, next to navi's own scan.
#
# The terrain chain answers per cell, and a LaserScan can only carry the first
# answer along each bearing -- 720 of them, out to the fan's reach. Measured
# over the whole route, the scan-shaped path covered 66k free cells against
# navi's 947k from the same run. As a grid nothing is thrown away, so this is
# how the judgement should reach a planner.
#
# Two sources, deliberately:
#   static_layer   the terrain grid -- where the ground is unsafe to walk on,
#                  including what a beam cannot see (drops, kerbs, roadway)
#   obstacle_layer navi's /scan -- what is physically standing there, out to
#                  20 m, which the terrain chain cannot match and should not
#                  be asked to
#
# Frames follow this stack: `map` is the fixed world LIO corrects, and the
# robot is `lidar_frame` (base_link hangs off the planar odometry).
# =============================================================================
costmap:
  costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: lidar_frame
      update_frequency: 2.0
      publish_frequency: 1.0
      resolution: 0.1
      # Not rolling: the point here is the map of the whole route. Sized and
      # placed to cover it with room to spare -- the bag runs from the origin
      # to about (17, -56).
      rolling_window: false
      width: 80
      height: 110
      origin_x: -30.0
      origin_y: -85.0
      track_unknown_space: true
      robot_radius: 0.45
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        # The relay's latched copy: the layer subscribes transient-local and
        # a live publisher is volatile, so they would never connect.
        map_topic: /terrain/map
        subscribe_to_updates: false
        # The terrain grid is not a floor plan; it grows as the robot walks,
        # and the costmap must take each new version rather than the first.
        map_subscribe_transient_local: true
        transform_tolerance: 1.0
        enabled: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          # navi's scan is best effort, like every sensor topic here.
          sensor_frame: ""
          marking: true
          clearing: true
          max_obstacle_height: 2.0
          obstacle_max_range: 20.0
          obstacle_min_range: 0.1
          raytrace_max_range: 21.0
          raytrace_min_range: 0.1
          inf_is_valid: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
        enabled: true

      always_send_full_costmap: true

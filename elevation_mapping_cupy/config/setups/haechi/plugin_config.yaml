# haechi navigation terrain-analysis chain.
#
# Same plugins as the gz_demo chain, which is where the numbers were verified
# against ground truth (slope 11.9 measured vs 12.0 true, curb 0.119 vs 0.12,
# risers ~0.15). Selected by haechi.launch.py through plugin_config_file; the
# digging chain in config/core stays the default for everyone else.
#
# TODO(measure): limits below are the quadruped envelope pending real trials --
# especially max step, which depends on gait, not just leg reach.
slope_filter:
  enable: True
  fill_nan: False
  is_height_layer: False
  layer_name: "slope"                       # degrees
  extra_params:
    window_size: 3
    min_valid_ratio: 0.5
step_filter:
  enable: True
  fill_nan: False
  is_height_layer: False
  layer_name: "step"                        # meters
  extra_params:
    window_size: 5                          # 0.25 m reach at 0.05 m cells
    min_valid_count: 4
roughness_filter:
  enable: True
  fill_nan: False
  is_height_layer: False
  layer_name: "roughness"                   # meters, RMS off the local plane
  extra_params:
    window_size: 5
    min_valid_count: 6
drivability_filter:
  enable: True
  fill_nan: False
  is_height_layer: False
  layer_name: "drivability"                 # 1 flat .. 0 at any limit
  extra_params:
    layers: ["slope", "step", "roughness"]
    limits: [25.0, 0.20, 0.05]

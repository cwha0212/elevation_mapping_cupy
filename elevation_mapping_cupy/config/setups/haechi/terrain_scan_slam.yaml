# =============================================================================
# slam_toolbox, used as an accumulator rather than a SLAM.
#
# The terrain fan's LaserScan carries what the terrain chain judged, not what
# a beam hit, and it reaches 3.5 m. Scan matching on that would be a second
# estimator arguing with FAST-LIO over a pose LIO already knows better, on
# evidence with no long-range structure to match against -- so it is off, and
# what remains is exactly the wanted thing: every bearing's verdict painted
# into a world-fixed occupancy grid at the pose LIO reports.
#
# Frames follow this stack's convention, which is not the usual one: `map` is
# the fixed world frame LIO corrects, and `odom` rides ON the robot (a static
# identity to `lidar_frame`). So `map` is what a normal stack would call
# odometry, and the grid this node builds gets its own frame to avoid two
# publishers of the same edge.
# =============================================================================
slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    odom_frame: map            # LIO's world pose is the odometry here
    map_frame: terrain_map     # the grid this node owns
    base_frame: lidar_frame
    scan_topic: /terrain_scan
    mode: mapping

    use_scan_matching: false   # see the header: LIO already has the pose
    use_scan_barycenter: true
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.05
    map_update_interval: 1.0
    resolution: 0.05
    # Matched to the fan's own reach. Above it slam_toolbox would treat the
    # inf returns as measurements to the stated maximum and paint free space
    # through ground the march never checked.
    max_laser_range: 3.5
    minimum_time_interval: 0.2
    transform_timeout: 0.5
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: false

    # A walking robot re-observes constantly; keep every scan that moved at
    # all, so the grid fills along the whole route rather than in jumps.
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.2
    scan_buffer_size: 20
    scan_buffer_maximum_scan_distance: 6.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    do_loop_closing: false     # LIO closes loops; this grid must not argue
    loop_search_maximum_distance: 3.0

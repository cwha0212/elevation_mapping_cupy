front_cam_pointcloud:
  channels: ["rgb", "chair", "sofa", "person"]
  fusion: ["color", "class_average", "class_average", "class_average"]
  topic_name: "semantic_pointcloud"
  semantic_segmentation: True
  publish_segmentation_image: True
  segmentation_model: "lraspp_mobilenet_v3_large"
  show_label_legend: False

  cam_info_topic: "/camera/depth/camera_info"
  image_topic: "/camera/rgb/image_raw"
  depth_topic: "/camera/depth/image_raw"
  cam_frame: "camera_rgb_optical_frame"

front_cam_image:
  channels: ["chair", "sofa", "person"]
  publish_topic: "semantic_image"
  publish_image_topic: "semantic_image_debug"
  channel_info_topic: "channel_info"
  feature_topic: "semantic_seg_feat"
  feat_image_topic: "semantic_seg_feat_im"
  feat_channel_info_topic: "feat_channel_info"

  semantic_segmentation: True
  feature_extractor: False
  segmentation_model: "lraspp_mobilenet_v3_large"
  show_label_legend: False
  image_topic: "/camera/rgb/image_raw"
  camera_info_topic: "/camera/depth/camera_info"
  resize: 0.5

# Template for a camera that publishes no CameraInfo (e.g. compressed image only).
# Filling camera_intrinsics.k switches the node off the CameraInfo topic; while it
# is empty the node keeps subscribing to camera_info_topic as before.
front_cam_image_static_info:
  channels: []
  publish_topic: "semantic_image"
  publish_image_topic: "semantic_image_debug"
  channel_info_topic: "channel_info"

  semantic_segmentation: True
  feature_extractor: False
  segmentation_model: "lraspp_mobilenet_v3_large"
  show_label_legend: False
  # "compressed" anywhere in the topic name selects the CompressedImage subscriber.
  image_topic: ""
  # Not subscribed to when camera_intrinsics.k is set; still names the republished
  # topic that elevation_mapping consumes ("<camera_info_topic>_resized").
  camera_info_topic: ""
  resize: 0.5

  camera_intrinsics:
    width: 0
    height: 0
    # "radtan" keeps d; every other name (including "plumb_bob") is treated as
    # undistorted by the elevation mapping projection kernel.
    distortion_model: "radtan"
    k: []   # [fx, 0, cx, 0, fy, cy, 0, 0, 1]
    d: []   # [k1, k2, p1, p2, k3]
    p: []   # derived from k when empty

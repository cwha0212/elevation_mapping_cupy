# Simulated forward camera for the semantic projection demo.
#
# Cityscapes classes, because road and sidewalk are the pair this whole branch
# exists to separate and no COCO or VOC checkpoint contains either. person and
# car come along for comparison: those the geometry would have caught anyway,
# and having both kinds in one run shows which verdicts the labels actually
# change.
gz_front_cam:
  image_topic: /color_cam/image
  camera_info_topic: camera_info          # republished as <name>_resized
  publish_topic: semantic_image
  publish_image_topic: semantic_image_debug
  channel_info_topic: channel_info

  # Quarter of 640x480. torch's GPU matmul is broken on this Jetson -- conv
  # works, cublasCreate does not -- so the attention layers fall back to CPU,
  # where 320x240 costs 1.5 s a frame and 160x120 costs 0.7 s. The map is
  # 0.05 m and the robot is meant to crawl past these objects, so the coarser
  # input costs little and buys back the frame rate.
  resize: 0.25

  semantic_segmentation: True
  feature_extractor: False
  segmentation_model: segformer_cityscapes
  channels: ["road", "sidewalk", "person", "car"]
  show_label_legend: False
